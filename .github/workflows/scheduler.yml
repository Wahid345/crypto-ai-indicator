name: Crypto AI Online Runner

on:
  schedule:
    - cron: '*/15 * * * *' # প্রতি ১৫ মিনিট পরপর অটো রান করবে
  workflow_dispatch: # ম্যানুয়ালি রান করার বাটন

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_SECRET_KEY: ${{ secrets.GATE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SIGNAL_CHAT_ID: ${{ secrets.SIGNAL_CHAT_ID }}
          TRADE_CHAT_ID: ${{ secrets.TRADE_CHAT_ID }}
          TARGET_TIMEFRAME: '15m'
        run: python crypto_ai_indicator.py